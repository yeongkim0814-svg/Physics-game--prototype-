<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <!-- 핀치줌/더블탭줌을 끄지 않으면 조이스틱 조작 중 화면이 확대돼 게임이 깨진다. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#111111" />
    <title>Physics Skill Game</title>
    <style>
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: var(--letterbox);
        /* 터치 제스처(스크롤/당겨서 새로고침/길게누르기 메뉴)가 게임 입력을 가로채지 않게 한다. */
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; touch-action: none; }
      #hint {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(13, 15, 10, 0.72); cursor: pointer; padding: 0 24px;
      }
      #hint > div {
        background: var(--panel);
        border: 2px solid var(--amber);
        border-radius: 0;
        color: var(--amber);
        padding: 14px 18px;
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.6;
        text-align: center;
      }
      #hint.hidden { display: none; }
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px;
        background: var(--amber); pointer-events: none; box-shadow: 0 0 4px rgba(255, 140, 30, 0.8);
      }
      .touch-only { display: none; }
      body.touch .touch-only { display: inline; }
      body.touch .desktop-only { display: none; }

      #touch-ui { display: none; }
      body.touch.playing #touch-ui { display: block; }
      #stick-base, #stick-knob, #run-icon {
        position: fixed; pointer-events: none; display: none;
        transform: translate(-50%, -50%);
      }
      #stick-base {
        width: 120px; height: 120px; border-radius: 50%;
        border: 2px solid var(--amber-dim);
        background: var(--amber-faint);
      }
      #stick-knob {
        width: 52px; height: 52px; border-radius: 50%;
        background: var(--amber);
        opacity: 0.55;
      }
      #run-icon {
        width: 56px; height: 56px; border-radius: 50%;
        border: 2px solid var(--amber-dim);
        background: var(--amber-faint);
        display: none; font-size: 32px; line-height: 56px; text-align: center; color: white;
        transition: transform 0.15s, background 0.15s;
      }
      #run-icon.active {
        background: var(--amber);
        color: var(--bg);
        transform: translate(-50%, -50%) scale(1.15);
      }
      #autorun-badge {
        position: fixed; display: none; background: var(--panel);
        border: 2px solid var(--amber-dim);
        border-radius: 0;
        color: var(--amber);
        font-size: 14px;
        font-family: var(--font);
        padding: 6px 12px;
        pointer-events: none;
        z-index: 1;
        left: max(24px, env(safe-area-inset-left));
        bottom: max(28px, calc(env(safe-area-inset-bottom) + 28px));
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="crosshair"></div>
    <div id="touch-ui">
      <div id="stick-base"></div>
      <div id="stick-knob"></div>
      <div id="run-icon">🏃</div>
    </div>
    <div id="autorun-badge">🏃 자동 달리기 · 스틱을 터치하면 해제</div>
    <div id="hint">
      <div>
        <span class="desktop-only">클릭해서 시작<br />WASD 이동 · 마우스 시점 · Shift 달리기 · E 터널링 · Q E=mc² 소멸 · Esc 해제</span>
        <span class="touch-only">
          화면을 터치해서 시작<br />
          왼쪽 드래그: 이동 · 오른쪽 드래그: 시점<br />
          스틱을 위로 쭉 올려 🏃에 맞추고 떼면 자동 달리기<br />
          오른쪽 아래 버튼: 터널링(벽 조준 → 확률 표시) · E=mc²(상자 조준 → 소멸·충전)<br />
          <small>가로 모드를 권장합니다</small>
        </span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
