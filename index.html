<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <!-- 핀치줌/더블탭줌을 끄지 않으면 조이스틱 조작 중 화면이 확대돼 게임이 깨진다. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#111111" />
    <title>Physics Skill Game</title>
    <style>
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #111;
        /* 터치 제스처(스크롤/당겨서 새로고침/길게누르기 메뉴)가 게임 입력을 가로채지 않게 한다. */
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; touch-action: none; }
      #hint {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #ddd; font: 16px/1.6 system-ui, sans-serif; text-align: center;
        background: rgba(0,0,0,.55); cursor: pointer; padding: 0 24px;
      }
      #hint.hidden { display: none; }
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
        border-radius: 50%; background: rgba(255,255,255,.8); pointer-events: none;
      }
      .touch-only { display: none; }
      body.touch .touch-only { display: inline; }
      body.touch .desktop-only { display: none; }

      #touch-ui { display: none; }
      body.touch.playing #touch-ui { display: block; }
      #stick-base, #stick-knob {
        position: fixed; border-radius: 50%; pointer-events: none; display: none;
        transform: translate(-50%, -50%);
      }
      #stick-base { width: 120px; height: 120px; border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); }
      #stick-knob { width: 52px; height: 52px; background: rgba(255,255,255,.5); }
      #stick-knob.locked { background: rgba(255,255,255,.8); box-shadow: 0 0 0 3px rgba(255,255,255,.6); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="crosshair"></div>
    <div id="touch-ui">
      <div id="stick-base"></div>
      <div id="stick-knob"></div>
    </div>
    <div id="hint">
      <div>
        <span class="desktop-only">클릭해서 시작<br />WASD 이동 · 마우스 시점 · Shift 달리기 · Esc 해제</span>
        <span class="touch-only">
          화면을 터치해서 시작<br />
          왼쪽 드래그: 이동 · 오른쪽 드래그: 시점<br />
          <small>가로 모드를 권장합니다</small>
        </span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
